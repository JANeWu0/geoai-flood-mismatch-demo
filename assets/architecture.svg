<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480">
  <rect width="1100" height="480" fill="#f8fafc"/>
  <style>
    .box{fill:white;stroke:#334155;stroke-width:2;rx:18;}
    .title{font-family:Arial, sans-serif;font-size:24px;font-weight:700;fill:#0f172a;}
    .txt{font-family:Arial, sans-serif;font-size:16px;fill:#334155;}
    .small{font-family:Arial, sans-serif;font-size:13px;fill:#475569;}
    .arrow{stroke:#0f172a;stroke-width:3;marker-end:url(#arrowhead);}
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0f172a" />
    </marker>
  </defs>
  <text x="40" y="46" class="title">GeoAI Flood Response–Impact Mismatch Demo</text>
  <rect x="50" y="95" width="260" height="130" class="box"/>
  <text x="75" y="130" class="title">CV Impact Layer</text>
  <text x="75" y="165" class="txt">Satellite / drone imagery</text>
  <text x="75" y="190" class="small">NDWI · SAR change · U-Net</text>
  <rect x="50" y="275" width="260" height="130" class="box"/>
  <text x="75" y="310" class="title">LLM Response Layer</text>
  <text x="75" y="345" class="txt">Social posts + reports</text>
  <text x="75" y="370" class="small">need · response · sentiment · location</text>
  <line x1="310" y1="160" x2="445" y2="230" class="arrow"/>
  <line x1="310" y1="340" x2="445" y2="270" class="arrow"/>
  <rect x="455" y="170" width="250" height="140" class="box"/>
  <text x="485" y="210" class="title">SMI Engine</text>
  <text x="485" y="245" class="txt">Compare impact share</text>
  <text x="485" y="270" class="txt">against response share</text>
  <text x="485" y="295" class="small">residual = R_share − I_share</text>
  <line x1="705" y1="240" x2="825" y2="240" class="arrow"/>
  <rect x="835" y="95" width="230" height="130" class="box"/>
  <text x="860" y="130" class="title">Map Diagnosis</text>
  <text x="860" y="165" class="txt">Under-response zones</text>
  <text x="860" y="190" class="small">e.g., rural lowlands</text>
  <rect x="835" y="275" width="230" height="130" class="box"/>
  <text x="860" y="310" class="title">Planning Action</text>
  <text x="860" y="345" class="txt">Pumps · shelters · access</text>
  <text x="860" y="370" class="small">adaptive governance + NbS</text>
</svg>
