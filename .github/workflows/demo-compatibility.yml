name: Demo compatibility

on:
  push:
    branches: [main, fix/streamlit-runtime-compatibility]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.12 / ${{ matrix.dependencies }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dependencies: [minimum-ui, resolved-ui]
    env:
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install minimum supported UI versions
        if: matrix.dependencies == 'minimum-ui'
        run: python -m pip install -r requirements.txt "streamlit==1.51.0" "plotly==5.24.0"
      - name: Install versions resolved from requirements
        if: matrix.dependencies == 'resolved-ui'
        run: python -m pip install -r requirements.txt
      - name: Check dependencies and record versions
        run: |
          python -m pip check
          python -m pip freeze
      - name: Run numerical and app-startup tests
        run: python -m pytest -q
