name: Minimal demo SMI label update

on:
  push:
    branches:
      - minimal-demo-smi-label

permissions:
  contents: write

jobs:
  update-label:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the revision branch
        uses: actions/checkout@v4
        with:
          ref: minimal-demo-smi-label
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Change only the homepage metric label
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app.py")
          text = path.read_text(encoding="utf-8")
          old = 'm1.metric("Share-based SMI", "{:.3f}".format(summary.smi))'
          new = 'm1.metric("Synthetic Demo SMI", "{:.3f}".format(summary.smi))'
          if text.count(old) != 1:
              raise SystemExit(f"Expected exactly one target line, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          python -m py_compile app.py

      - name: Commit the one-line change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Clarify homepage SMI as synthetic demo output"
          git push origin HEAD:minimal-demo-smi-label
